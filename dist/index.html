<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>潮汐 · 四季海岸</title><link rel="stylesheet" href="style.css?v=score-board-1"></head>
<body class="clean"><main class="app-window" aria-label="四季钓鱼小窗">
<div class="window-bar"><span class="window-title"><b class="dot"></b>潮汐 · 四季海岸</span><button id="season-badge" title="点击预览下一季；设置中可开启自动四季">夏 · 四季流转</button><button id="weather-badge" title="点击预览天气；设置中恢复自动">晴 · 自动</button><button id="settings" aria-label="显示或隐藏控制面板" aria-expanded="false" aria-controls="controls" title="设置 · H">设置</button></div>
<div class="play-area"><aside id="journal-host" aria-label="钓获图鉴与成就"></aside><div class="coast-stage"><div class="scene"><canvas id="sea" aria-label="宁静海湾，可拖动游艇或点击水面移动船只"></canvas><div id="error" hidden></div></div>
<div class="status-bar"><span id="fishing-status" aria-live="polite"></span><span class="gesture-hint">拖动小船 · 点击水面航行</span></div>
</div></div><footer id="controls"><section class="panel" aria-label="场景设置"><div class="panel-title"><span>场景设置</span><span id="stats">WEBGL</span><button id="hide" aria-label="收起场景设置">收起</button></div>
<div class="control-grid"><label class="season-label" for="season">季节 <select id="season"><option value="auto">自动流转 · 2 分钟 / 季</option><option value="0">春 · 嫩绿与浅青</option><option value="1">夏 · 原色碧海</option><option value="2">秋 · 金草与青湾</option><option value="3">冬 · 银沙与雾蓝</option></select></label><label for="weather">天气<select id="weather"><option value="auto">自动 · 随季节变化</option><option value="0">晴 · 明亮海岸</option><option value="1">多云 · 柔和光线</option><option value="2">海风 · 风动草浪</option><option value="3">雨 · 湿岸与涟漪</option><option value="4">雪 · 缓落与积雪</option><option value="5">雷阵雨 · 强雨（光声可选）</option></select></label><label>浪的力量 <output id="heightValue">0.18</output><input id="height" type="range" min="0.05" max="1.2" value="0.18" step="0.05"></label><label>海浪速度 <output id="speedValue">0.65</output><input id="speed" type="range" min="0.2" max="1.6" value="0.65" step="0.05"></label><label>像素颗粒 <output id="pixelValue">3</output><input id="pixel" type="range" min="2" max="5" value="3" step="1"></label></div>
<div class="storm-options"><label><input id="lightning" type="checkbox">闪电光效</label><label><input id="thunder-sound" type="checkbox">雷声</label><span id="storm-help" aria-live="polite">光效与声音默认关闭，可分别开启</span></div><div class="actions"><button id="pause">Ⅱ 暂停海浪</button><button id="reset">↺ 重置视角</button><button id="fullscreen" title="全屏">⛶ 全屏</button></div></section></footer></main><script src="species.js?v=rarity-1"></script><script src="journal.js?v=score-board-1"></script><script src="searchlight.js"></script><script src="motion.js?v=lightfish-1"></script><script src="clouds.js?v=seasonal-light-2"></script><script src="fishing.js?v=yacht-2"></script><script src="seasons.js"></script><script src="weather.js"></script><script src="birds.js"></script><script src="lightning.js"></script><script src="thunder-audio.js"></script><script src="coast.js?v=lightfish-1"></script></body></html>
